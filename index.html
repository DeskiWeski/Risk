html,body{height:100%;margin:0;background:#000;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:'Barlow Condensed',Impact,sans-serif}

@media (orientation:portrait) and (max-width:900px){#rot{display:flex}}

function stances(w,nA,nD){
  if(w.id===0)return ['trade','hold'];
  const rA=nA/Math.max(1,nD),rD=nD/Math.max(1,nA);

}
const POSTS=[330,572,640];

  if(won&&E>600){const k=ease(clamp((E-600)/900,0,1)),fx=480,fb=300;ctx.strokeStyle='#ddd';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(fx,fb+60);ctx.lineTo(fx,fb+60-k*86);ctx.stroke();ctx.fillStyle=att.c;ctx.beginPath();ctx.moveTo(fx,fb+60-k*86);ctx.lineTo(fx+46,fb+60-k*86+8+Math.sin(now/180)*3);ctx.lineTo(fx,fb+60-k*86+22);ctx.fill();}
  // gun roar once per roll
  if(w.id>0&&T>650&&!WA.b){WA.b=1;RAW.g();setTimeout(RAW.g,170);setTimeout(RAW.g,360);}
  ctx.restore();
  // ---- sniper scope overlay (screen space)
  if(snK>0){const k=ease(snK),bh=34*k;ctx.fillStyle='#000';ctx.fillRect(0,0,W,bh);ctx.fillRect(0,H-bh,W,bh);
    const g=ctx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+(.65*k)+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.save();ctx.globalAlpha=.55*k;ctx.strokeStyle='#e8f0ff';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(W/2,H/2,120,0,7);ctx.moveTo(W/2-140,H/2);ctx.lineTo(W/2+140,H/2);ctx.moveTo(W/2,H/2-140);ctx.lineTo(W/2,H/2+140);ctx.stroke();ctx.restore();
    tx(T<1350?'SCOPE LOCKED...':(T<1700?'BREATHE... SQUEEZE.':'CRACK!'),W/2,H-18,18,'#ff5a4a','center',BF);}
  // ---- UI
  tx('WAR ON '+TD[w.d][0].toUpperCase(),W/2,26,36,'#ffd23f','center',BF,'#000');
  tx(dn(att)+'   VS   '+dn(def),W/2,52,15,'#fff','center');
  if(!pre)tx('ROUND '+w.id,W/2,72,13,'#9fb3e8','center');
  for(const [P,x,cnt,t_,st_] of [[att,76,nA,ta,stA],[def,884,nD,td,stD]]){
    ctx.save();ctx.beginPath();ctx.arc(x,98,44,0,7);ctx.fillStyle='rgba(8,10,24,.85)';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=P.c;ctx.stroke();ctx.clip();leader(P.look,x,98,.8,P.c);ctx.restore();
    fitTx(P.n,x,158,22,130,'#fff','center',BF);
    const shown=(w.id>0&&T<1900)?(P===att?nAbef:nDbef):cnt;
    tx(String(shown),x,190,40,'#fff','center',BF,'#000');tx('GOONS',x,214,11,'#9fb3e8','center');
    const sl=pre?(P===att?'ARRIVING':'ALERTED'):STN[st_];pill(x-58,222,116,20,'rgba(8,10,24,.88)',STC[st_]||'#9fb3e8');tx(sl,x,232,12,STC[st_]||'#fff','center',BF);
    const items=[t_.rpg?'RPG':'',t_.sniper?'SNIPER':'',t_.tank?'TANK':'',t_.heli?'HELI':''].filter(Boolean);
    items.forEach((s,i)=>{pill(x-35,248+i*22,70,18,'rgba(255,140,30,.9)');tx(s,x,258+i*22,12,'#1a0a00','center',BF);});}
  // dice
  const na=w.id>0?w.A.length:0,nd=w.id>0?w.D.length:0,rolling=w.id>0&&T>=800&&T<1500,settled=w.id>0&&T>=1500,tt0=T-800;
  const ax=i=>420-i*58,dxx=i=>540+i*58,dy=100;
  const rv=(k,i)=>1+((w.id*7+i*13+k*3+Math.floor(T/75)*5)%6);
  const showDice=w.id>0&&T>=800;
  if(showDice){
    for(let i=0;i<na;i++){const bounce=rolling?-Math.abs(Math.sin(tt0/110+i))*30*(1-tt0/700):0;const win=settled&&i<nd&&w.A[i]>w.D[i],lose=settled&&i<nd&&!win;
      die(ax(i),dy+bounce,46,rolling?rv(0,i):w.A[i],att.c,'#fff',rolling?tt0/90+i:0,win?'#ffd23f':null,lose&&T>1700);
      if(settled&&i<nd&&T>1550)tx(win?'HIT':'MISS',ax(i),dy+36,12,win?'#ffd23f':'#ff7a5a','center',BF,'#000');}
    for(let i=0;i<nd;i++){const bounce=rolling?-Math.abs(Math.sin(tt0/110+i+2))*30*(1-tt0/700):0;const win=settled&&i<na&&!(w.A[i]>w.D[i]),lose=settled&&i<na&&!win;
      die(dxx(i),dy+bounce,46,rolling?rv(1,i):w.D[i],'#f4f1e6','#111',rolling?-tt0/90-i:0,win?'#ffd23f':null,lose&&T>1700);
      if(settled&&i<na&&T>1550)tx(win?'HOLDS':'DOWN',dxx(i),dy+36,12,win?'#ffd23f':'#ff7a5a','center',BF,'#000');}
    if(na+nd>0)tx('VS',480,dy+2,22,'#ffd23f','center',BF);}
  // RETURN FIRE dice: losers snap off a last shot
  const RA=w.RA||[],RD=w.RD||[];
  if(w.id>0&&T>=2150&&T<3500&&RA.length+RD.length>0){
    tx('RETURN FIRE  (a 6 drops one enemy)',480,153,12,"#ff9a7a",'center',BF,'#000');
    RA.forEach((v,i)=>{const th=T>2500;die(ax(i),179,26,th?v:1+((Math.floor(T/70)+i*3)%6),att.c,'#fff',th?0:T/80,th&&v===6?'#ffd23f':null,th&&v!==6);});
    RD.forEach((v,i)=>{const th=T>2500;die(dxx(i),179,26,th?v:1+((Math.floor(T/70)+i*5)%6),'#f4f1e6','#111',th?0:-T/80,th&&v===6?'#ffd23f':null,th&&v!==6);});
    if(T>2550&&(w.ra||w.rd))tx('DYING SHOT HITS!',480,200,18,'#ffd23f','center',BF,'#000');}
  // story caption
  const A=att.n,D=def.n,TN=TD[w.d][0];
  const pk=(arr,k)=>arr[Math.abs(k)%arr.length];
  let cap='';
  if(pre){cap=S0<1250?A+' rolls up on '+TN+': two black SUVs, lights low.':(S0<2400?'Doors swing open. '+A+"'s crew spills out.":(S0<3500?D+"'s lookouts spot them. Whistles go off down the block.":'Everybody dives for cover. Nobody blinks first.'));}
  else if(T<800){
    if(w.id===1)cap=pk([A+' opens up from behind the SUVs.',A+' lays down cover fire.'],w.id);
    else if(stA==='push')cap=A+' has the numbers. Leapfrogging up, covering each other.';
    else if(stA==='flank')cap=A+' is outgunned. Two goons slip around the side to flank.';
    else if(stD==='fallback')cap=D+' is bleeding goons. Falling back behind the '+(lm==='tower'?'dumpster':lmName.toLowerCase())+'.';
    else if(stD==='counter')cap=D+' smells weakness and steps out to counterattack!';
    else cap=pk(['Standoff. Both crews trade fire from cover.','Heads down. Bullets chew the dumpster.'],w.id);
    if(hEv('snipSetA')||hEv('snipSetD'))cap='Up on the roof, a sniper settles in. Red dot sweeping the street...';
    if(hEv('heliA')||hEv('heliD'))cap='A gunship swings in over '+TN+', spotlight blazing!';
    if(hEv('rpgA')||hEv('rpgD'))cap='Somebody on the street just shouldered an RPG...';
  }else if(T<1500){
    cap=hEv('snipA')||hEv('snipD')?'The red dot locks on. Everybody holds their breath.':(hEv('rpgA')||hEv('rpgD')?'RPG!!':(hEv('heliA')||hEv('heliD')?'Gunship strafing run!':'Gunfire everywhere!'));
  }else if(T<2600){
    const aw=w.dl,dw=w.al;cap=(aw&&dw)?pk(TRADE,w.id):aw?pk(ATKW,w.id):dw?pk(DEFW,w.id):'Nobody hit. Walls take the damage.';
    if(hEv('snipA')||hEv('snipD'))cap='CRACK! One shot, one goon.';
    if(w.st==='won')cap='The last defender drops. '+TN+' is wide open!';
  }else{
    if(w.ra||w.rd)cap='A goon goes down swinging: DYING SHOT lands!';
    else if(won)cap=A+' storms in and plants the colors on '+TN+'.';
    else if(w.dl>0&&stD==='fallback')cap=D+' drags a wounded goon behind the '+(lm==='tower'?'dumpster':lmName.toLowerCase())+'.';
    else if(w.al>0)cap=A+' pulls back to reload. '+(stA==='flank'?'The flankers are still out there.':'Next volley coming.');
    else cap='Smoke clears. Both crews reload for the next round.';
  }
  if(w.st==='lost')cap=w.why==='broke'?A+' is out of goons. The lead SUV is on fire.':A+' calls it. The SUVs peel out into the dark.';
  if(won&&E>500)cap=A+' plants the colors on '+TN+'. '+D+' scatters.';
  if(cap){ctx.font='700 18px '+CF;const cw=Math.min(W-40,ctx.measureText(cap).width+34);pill(W/2-cw/2,208,cw,32,'rgba(8,10,26,.92)','#ffd23f');fitTx(cap,W/2,224,18,cw-20,'#fff','center');}
  // speech bubbles: orders early, taunts late

    ctx.font='700 14px '+CF;const bw=ctx.measureText(txt).width+22,bx=clamp(g.x,bw/2+4,W-bw/2-4);pill(bx-bw/2,g.y-84,bw,26,'#fff','#10142a');
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(g.x-5,g.y-58);ctx.lineTo(g.x+5,g.y-58);ctx.lineTo(g.x,g.y-46);ctx.fill();tx(txt,bx,g.y-71,14,'#10142a','center');};
  const cA=CATCH[att.look],cD=CATCH[def.look];

  if(pre&&S0>2500){const ph=Math.floor((S0-2500)/1200);if(ph%2===0)bub(gA,cA[ph%cA.length]);else bub(gD,cD[ph%cD.length]);}
  else if(!pre&&T>150&&T<800&&!(snK>0)){if(w.id%2)bub(gA,ORD_A[stA]);else bub(gD,ORD_D[stD]);}
  else if(!pre&&T>2700&&T<3600&&w.st==='ready'){if(w.dl>=w.al)bub(gA,cA[w.id%cA.length]);else bub(gD,cD[w.id%cD.length]);}
  // endings
  if(won){ctx.save();for(let i=0;i<22;i++){const x=(i*97+now/9*(1+i%3))%W,y=((now/4+i*53)%(H+60))-30;ctx.globalAlpha=.5;tx('$',x,y,22+i%4*4,'#7fe0a0','center',BF);}ctx.restore();tx('TURF TAKEN!',W/2,262,46,'#ffd23f','center',BF,'#000');}

  }else{const who=G.P[G.cur];tx(won?'Moving goons into '+TD[w.d][0]+'...':dn(who)+' is waging war...',W/2,by+22,20,'#9fb3e8','center');}

})();
