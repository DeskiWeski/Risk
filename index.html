        const jx=(hh(bu,g.r)-.5)*30,jy=(hh(bu,g.r+5)-.5)*14,ex=tg.x+jx,ey=tg.y-4+jy,p0=clamp(u*2.2,0,1),p1=clamp(p0-.28,0,1);
        ctx.strokeStyle='rgba(255,226,140,.95)';ctx.lineWidth=1.7;ctx.beginPath();ctx.moveTo(gx+(ex-gx)*p1,gy+(ey-gy)*p1);ctx.lineTo(gx+(ex-gx)*p0,gy+(ey-gy)*p0);ctx.stroke();
        spark(ex,ey,clamp((u*2.2-1)*2,0,1),bu+g.r);
        ctx.fillStyle='#d9a93a';ctx.fillRect(gx-fdir*8+(-fdir)*u*10,gy+4+u*u*26,2.4,1.4);
      }
    }
  };
  // draw order by lane: defender goons (far), attacker SUV, attacker goons (near)
  shoot(gD,gA,def,-1,1);
  suv(sx_a,LY_A,1,att,open,holesA,burnA,now,sx_a);
  shoot(gA,gD,att,1,0);
  // overflow badges
  if(nAbef>10)tx('+'+(nAbef-10),sx_a-90,LY_A-10,22,'#fff','center',BF,'#000');
  if(nDbef>10)tx('+'+(nDbef-10),dx_+90,LY_D-10,22,'#fff','center',BF,'#000');
  // ---- helicopters
  const heliShow=(t,hrem,evs,side)=>t.heli&&(hrem>0||evs.length>0);
  const hEv=k=>ev.indexOf(k)>=0;
  if(heliShow(ta,w.hA,ev.filter(e=>e==='heliA'),0)){
    let hx=-120+(175+120)*ease(clamp(S0/1400,0,1)),hy=140+Math.sin(now/300)*5;if(w.hA===0&&w.id>0&&T>1500)hx+= (T-1500)*.9;
    const fi=hEv('heliA')&&T>80&&T<1500;heli(hx,hy,1,att,true,fi,now,pre?420:480,LY_D+10);
    if(fi){const tg=target(gD,w.id);for(let k=0;k<5;k++){const u=((T/90+k*.2)%1),tx2=(tg?tg.x:480)+(hh(k,w.id)-.5)*120,ty2=LY_D+(hh(k,3)-.5)*30;ctx.strokeStyle='rgba(255,226,140,.9)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(hx+(tx2-hx)*u*.9+40*(1-u),hy+(ty2-hy)*u*.9+10);ctx.lineTo(hx+(tx2-hx)*(u*.9+.1),hy+(ty2-hy)*(u*.9+.1));ctx.stroke();spark(tx2,ty2,clamp((u-.8)*5,0,1),k+w.id);}}
  }
  if(heliShow(td,w.hD,ev.filter(e=>e==='heliD'),1)){
    let hx=W+120-(W+120-785)*ease(clamp(S0/1400,0,1)),hy=150+Math.sin(now/310)*5;if(w.hD===0&&w.id>0&&T>1500)hx-=(T-1500)*.9;
    const fi=hEv('heliD')&&T>80&&T<1500;heli(hx,hy,-1,def,true,fi,now,pre?540:480,LY_A+10);
    if(fi){const tg=target(gA,w.id);for(let k=0;k<5;k++){const u=((T/90+k*.2)%1),tx2=(tg?tg.x:480)+(hh(k,w.id)-.5)*120,ty2=LY_A+(hh(k,4)-.5)*30;ctx.strokeStyle='rgba(255,226,140,.9)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(hx+(tx2-hx)*u*.9-40*(1-u),hy+(ty2-hy)*u*.9+10);ctx.lineTo(hx+(tx2-hx)*(u*.9+.1),hy+(ty2-hy)*(u*.9+.1));ctx.stroke();spark(tx2,ty2,clamp((u-.8)*5,0,1),k+w.id);}}
  }
  // ---- RPG rockets (first roll)
  const rocket=(fromX,fromY,toX,toY,t0)=>{const u=clamp((T-t0)/520,0,1.2);if(u<=0)return;
    if(u<1){const x=fromX+(toX-fromX)*u,y=fromY+(toY-fromY)*u-Math.sin(u*Math.PI)*30;
      for(let k=0;k<10;k++){const uu=Math.max(0,u-k*.03),xx=fromX+(toX-fromX)*uu,yy=fromY+(toY-fromY)*uu-Math.sin(uu*Math.PI)*30;ctx.globalAlpha=.6-k*.055;ctx.fillStyle=k<3?'#ffd070':'#9a9a9a';ctx.beginPath();ctx.arc(xx,yy,6-k*.4,0,7);ctx.fill();}ctx.globalAlpha=1;
      ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(toY-fromY,toX-fromX));ctx.fillStyle='#4a5a3a';ctx.fillRect(-10,-3,20,6);ctx.fillStyle='#c02818';ctx.beginPath();ctx.moveTo(10,-3);ctx.lineTo(18,0);ctx.lineTo(10,3);ctx.fill();ctx.restore();}
    else boom(toX,toY,u-1<0?0:(u-1)/.2*0+clamp((T-t0-520)/650,0,.99),70);};
  if(hEv('rpgA')){const g=gA.find(q=>q.vis)||{x:sx_a,y:LY_A};const tg=gD.find(q=>q.vis)||{x:dx_,y:LY_D};rocket(g.x+20,g.y-12,tg.x,tg.y-6,150);if(T>140&&T<260){ctx.fillStyle='rgba(255,200,100,'+(1-(T-140)/120)+')';ctx.beginPath();ctx.arc(g.x-14,g.y-6,22,0,7);ctx.fill();}}
  if(hEv('rpgD')){const g=gD.find(q=>q.vis)||{x:dx_,y:LY_D};const tg=gA.find(q=>q.vis)||{x:sx_a,y:LY_A};rocket(g.x-20,g.y-12,tg.x,tg.y-6,250);if(T>240&&T<360){ctx.fillStyle='rgba(255,200,100,'+(1-(T-240)/120)+')';ctx.beginPath();ctx.arc(g.x+14,g.y-6,22,0,7);ctx.fill();}}
  // tank shells impact
  if(w.id>0&&ta.tank&&T>400&&T<1000){const k=(T-400)/600;boom(dx_-30+hh(w.id,1)*60,LY_D-14,k,56);}
  if(w.id>0&&td.tank&&T>500&&T<1100){const k=(T-500)/600;boom(sx_a-30+hh(w.id,2)*60,LY_A-14,k,56);}
  // skid smoke
  if(pre&&S0>700&&S0<1900){const k=(S0-700)/1200;for(const [sx2,sy2,d2] of [[ax_-40,LY_A,-1],[dx_+40,LY_D,1]])for(let i=0;i<5;i++){ctx.globalAlpha=(1-k)*.35;ctx.fillStyle='#aaa';ctx.beginPath();ctx.arc(sx2+d2*(k*50+i*10),sy2-4-i*2-k*14,8+i*3+k*10,0,7);ctx.fill();}ctx.globalAlpha=1;}
  // gun roar once per roll
  if(w.id>0&&T>60&&!WA.b){WA.b=1;RAW.g();setTimeout(RAW.g,170);setTimeout(RAW.g,360);if(ev.length){setTimeout(RAW.g,520);}}
  // ---- headline + busts
  tx('WAR ON '+TD[w.d][0].toUpperCase(),W/2,26,36,'#ffd23f','center',BF,'#000');
  tx(dn(att)+'   VS   '+dn(def),W/2,52,15,'#fff','center');
  for(const [P,x,cnt,t_,dl_] of [[att,76,nA,ta,w.hA],[def,884,nD,td,w.hD]]){
    ctx.save();ctx.beginPath();ctx.arc(x,98,44,0,7);ctx.fillStyle='rgba(8,10,24,.85)';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=P.c;ctx.stroke();ctx.clip();leader(P.look,x,98,.8,P.c);ctx.restore();
    fitTx(P.n,x,158,22,130,'#fff','center',BF);
    const shown=(w.id>0&&T<1100)?(P===att?nAbef:nDbef):cnt;
    tx(String(shown),x,190,40,'#fff','center',BF,'#000');tx('GOONS',x,214,11,'#9fb3e8','center');
    const items=[t_.rpg?'RPG':'',t_.tank?'TANK':'',t_.heli?'HELI':''].filter(Boolean);
    items.forEach((s,i)=>{pill(x-35,228+i*22,70,18,'rgba(255,140,30,.9)');tx(s,x,238+i*22,12,'#1a0a00','center',BF);});}
  // ---- dice
  const na=w.id>0?w.A.length:0,nd=w.id>0?w.D.length:0;
  const rolling=w.id>0&&T<900,settled=w.id>0&&T>=900;
  const ax=i=>420-i*58,dxx=i=>540+i*58,dy=104;
  const rv=(k,i)=>1+((w.id*7+i*13+k*3+Math.floor(T/75)*5)%6);
  for(let i=0;i<na;i++){const bounce=rolling?-Math.abs(Math.sin(T/120+i))*30*(1-T/900):0;const win=settled&&i<nd&&w.A[i]>w.D[i],lose=settled&&i<nd&&!win;
    die(ax(i),dy+bounce,46,rolling?rv(0,i):w.A[i],att.c,'#fff',rolling?T/90+i:0,win?'#ffd23f':null,lose&&T>1000);
    if(settled&&i<nd&&T>950)tx(win?'HIT':'MISS',ax(i),dy+36,12,win?'#ffd23f':'#ff7a5a','center',BF,'#000');}
  for(let i=0;i<nd;i++){const bounce=rolling?-Math.abs(Math.sin(T/120+i+2))*30*(1-T/900):0;const win=settled&&i<na&&!(w.A[i]>w.D[i]),lose=settled&&i<na&&!win;
    die(dxx(i),dy+bounce,46,rolling?rv(1,i):w.D[i],'#f4f1e6','#111',rolling?-T/90-i:0,win?'#ffd23f':null,lose&&T>1000);
    if(settled&&i<na&&T>950)tx(win?'HOLDS':'DOWN',dxx(i),dy+36,12,win?'#ffd23f':'#ff7a5a','center',BF,'#000');}
  if(w.id>0&&na+nd>0)tx('VS',480,dy+2,22,'#ffd23f','center',BF);
  // ---- caption + bubbles
  let cap='';
  if(pre)cap=S0<1250?'Black SUVs pull up on '+TD[w.d][0]+'...':(S0<2300?'Doors open. Goons pile out!':'Guns up! Shots about to fly...');
  else if(T<1000){cap=hEv('rpgA')||hEv('rpgD')?'RPG!!':(hEv('heliA')||hEv('heliD')?'Gunship overhead!':'Gunfire everywhere!');}
  else{const aw=w.dl,dw=w.al;cap=(aw&&dw)?TRADE[w.id%2]:aw?ATKW[w.id%ATKW.length]:DEFW[w.id%DEFW.length];
    if(w.st==='won'||w.st==='taken')cap='Last goon drops. '+TD[w.d][0]+' is wide open!';
    if(w.st==='lost')cap=w.why==='broke'?'Out of goons. The SUV is toast.':'Attackers floor it and bail.';}
  if(cap){ctx.font='700 19px '+CF;const cw=ctx.measureText(cap).width+34;pill(W/2-cw/2,156,cw,34,'rgba(8,10,26,.9)','#ffd23f');tx(cap,W/2,173,19,'#fff','center');}
  const bub=(list,P,seed,txt)=>{const g=list.find(q=>q.vis&&q.fall<.1&&q.r===2)||list.find(q=>q.vis&&q.fall<.1);if(!g)return;
    ctx.font='700 14px '+CF;const bw=ctx.measureText(txt).width+22;const bx=clamp(g.x,bw/2+4,W-bw/2-4);pill(bx-bw/2,g.y-82,bw,26,'#fff','#10142a');
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(g.x-5,g.y-56);ctx.lineTo(g.x+5,g.y-56);ctx.lineTo(g.x,g.y-44);ctx.fill();tx(txt,bx,g.y-69,14,'#10142a','center');};
  const cA=CATCH[att.look],cD=CATCH[def.look];
  if(pre&&S0>2350){const ph=Math.floor(S0/1400);if(ph%2===0)bub(gA,att,0,cA[ph%cA.length]);else bub(gD,def,1,cD[ph%cD.length]);}
  else if(!pre&&T>1150&&T<2000&&w.st==='ready'){if(w.dl>=w.al)bub(gA,att,0,cA[w.id%cA.length]);else bub(gD,def,1,cD[w.id%cD.length]);}
  // ---- endings
  if(w.st==='won'||w.st==='taken'){ctx.save();for(let i=0;i<22;i++){const x=(i*97+now/9*(1+i%3))%W,y=((now/4+i*53)%(H+60))-30;ctx.globalAlpha=.5;tx('$',x,y,22+i%4*4,'#7fe0a0','center',BF);}ctx.restore();
    tx('TURF TAKEN!',W/2,250,50,'#ffd23f','center',BF,'#000');}
  if(w.st==='lost')tx(w.why==='broke'?'OUT OF GOONS!':'PULLING BACK',W/2,250,46,'#ff7a5a','center',BF,'#000');
  // ---- controls
  ctx.fillStyle='#05070f';ctx.fillRect(0,H-58,W,58);BT=[];const by=H-52;
  if(actor){
    if(w.st==='ready'){const en=!w.ret;btn(300,by,360,44,w.ret?'PULLING OUT...':'RETREAT',en,()=>act('retreat'),'#7a3a12');
      tx(w.rolled?'Shootout rolling automatically. Retreat any time.':'Locked and loaded. Firing in a moment...',W/2,by-6+0,0.1,'#000');}
    else tx(w.st==='taken'||w.st==='won'?'Taking the turf...':'...',W/2,by+22,20,'#9fb3e8','center');
  }else{const who=G.P[G.cur];tx(w.st==='won'?'Moving goons into '+TD[w.d][0]+'...':dn(who)+' is waging war...',W/2,by+22,20,'#9fb3e8','center');}
}
})();
